<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Image Tagger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1c1c1e;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }

        .header {
            max-width: 1400px;
            margin: 0 auto 30px;
            padding: 20px;
            background: #2c2c2e;
            border-radius: 8px;
        }

        .header h1 {
            color: #c8a46e;
            margin-bottom: 10px;
        }

        .progress {
            margin-top: 15px;
            font-size: 14px;
            color: #999;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #c8a46e;
            transition: width 0.3s ease;
        }

        .controls {
            max-width: 1400px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            background: #c8a46e;
            color: #1c1c1e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #d4b47e;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: #c8a46e;
            border: 2px solid #c8a46e;
        }

        .btn-secondary:hover {
            background: rgba(200, 164, 110, 0.1);
        }

        .filter-section {
            max-width: 1400px;
            margin: 0 auto 20px;
            padding: 15px;
            background: #2c2c2e;
            border-radius: 8px;
        }

        .filter-section label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
        }

        .filter-section select {
            width: 200px;
            padding: 8px;
            background: #3a3a3c;
            color: #fff;
            border: 1px solid #4a4a4c;
            border-radius: 4px;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .image-card {
            background: #2c2c2e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .image-card.complete {
            border-color: #30d158;
        }

        .image-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .thumbnail {
            flex-shrink: 0;
            width: 200px;
            height: 150px;
            object-fit: contain;
            background: #1c1c1e;
            border-radius: 4px;
        }

        .image-info {
            flex: 1;
        }

        .filename {
            font-size: 14px;
            color: #c8a46e;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
        }

        .current-tags {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .tag-section {
            margin-bottom: 20px;
        }

        .tag-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 10px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #3a3a3c;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .checkbox-label:hover {
            background: #4a4a4c;
        }

        .checkbox-label input[type="checkbox"] {
            cursor: pointer;
        }

        .other-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .other-input input {
            flex: 1;
            padding: 8px 12px;
            background: #3a3a3c;
            border: 1px solid #4a4a4c;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .other-input button {
            padding: 8px 16px;
            background: #c8a46e;
            color: #1c1c1e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .keywords-input {
            width: 100%;
            padding: 10px;
            background: #3a3a3c;
            border: 1px solid #4a4a4c;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            min-height: 60px;
        }

        .sort-input {
            width: 100px;
            padding: 8px;
            background: #3a3a3c;
            border: 1px solid #4a4a4c;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .complete-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #30d158;
            color: #1c1c1e;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }

        .upload-section {
            max-width: 1400px;
            margin: 0 auto 20px;
            padding: 20px;
            background: #2c2c2e;
            border-radius: 8px;
            text-align: center;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 12px 24px;
            background: #c8a46e;
            color: #1c1c1e;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .upload-label:hover {
            background: #d4b47e;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Portfolio Image Tagger</h1>
        <p>Tag your portfolio images with disciplines, clients, and keywords.</p>
        <div class="progress">
            <span id="progress-text">0 of 0 images tagged</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="upload-section" id="upload-section">
        <p style="margin-bottom: 15px;">Upload your manifest.json file to begin tagging</p>
        <label for="manifest-upload" class="upload-label">
            Choose manifest.json
        </label>
        <input type="file" id="manifest-upload" accept=".json">
    </div>

    <div class="controls hidden" id="controls">
        <button class="btn" onclick="saveProgress()">💾 Save Progress</button>
        <button class="btn" onclick="exportManifest()">⬇️ Download Updated Manifest</button>
        <button class="btn btn-secondary" onclick="loadProgress()">📂 Load Saved Progress</button>
        <button class="btn btn-secondary" onclick="clearProgress()">🗑️ Clear All Progress</button>
    </div>

    <div class="filter-section hidden" id="filter-section">
        <label for="filter-discipline">Filter by Discipline:</label>
        <select id="filter-discipline" onchange="filterImages()">
            <option value="">All Disciplines</option>
        </select>
    </div>

    <div class="container" id="container">
        <div class="loading">Upload manifest.json to begin</div>
    </div>

    <script>
        let manifestData = [];
        let allDisciplines = new Set(['backgrounds', 'books', 'character-design', 'concept-art', 'illustration', 'logos', 'NFTs', 'toy-design']);
        let allClients = new Set();
        let currentFilter = '';

        // Load manifest file
        document.getElementById('manifest-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    manifestData = JSON.parse(event.target.result);
                    
                    // Extract existing clients
                    manifestData.forEach(item => {
                        if (item.clients && Array.isArray(item.clients)) {
                            item.clients.forEach(client => allClients.add(client));
                        }
                    });

                    document.getElementById('upload-section').classList.add('hidden');
                    document.getElementById('controls').classList.remove('hidden');
                    document.getElementById('filter-section').classList.remove('hidden');
                    
                    populateFilterDropdown();
                    renderImages();
                    updateProgress();
                } catch (err) {
                    alert('Error reading manifest file: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        function populateFilterDropdown() {
            const select = document.getElementById('filter-discipline');
            allDisciplines.forEach(discipline => {
                const option = document.createElement('option');
                option.value = discipline;
                option.textContent = discipline;
                select.appendChild(option);
            });
        }

        function filterImages() {
            currentFilter = document.getElementById('filter-discipline').value;
            renderImages();
        }

        function renderImages() {
            const container = document.getElementById('container');
            container.innerHTML = '';

            const filteredData = currentFilter 
                ? manifestData.filter(item => item.discipline === currentFilter)
                : manifestData;

            filteredData.forEach((item, index) => {
                const actualIndex = manifestData.indexOf(item);
                const card = createImageCard(item, actualIndex);
                container.appendChild(card);
            });
        }

        function createImageCard(item, index) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.id = `card-${index}`;
            
            const isComplete = item.discipline && 
                              item.clients && item.clients.length > 0 && 
                              item.keywords && item.keywords.length > 0;
            
            if (isComplete) {
                card.classList.add('complete');
            }

            const thumbnailPath = item.thumbnail || item.file;
            const filename = item.file.split('/').pop();

            card.innerHTML = `
                <div class="image-header">
                    <img class="thumbnail" src="${thumbnailPath}" alt="${filename}" onerror="this.style.display='none'">
                    <div class="image-info">
                        <div class="filename">${item.file}</div>
                        <div class="current-tags">
                            Current: ${item.discipline || 'no discipline'} | 
                            Clients: ${item.clients && item.clients.length ? item.clients.join(', ') : 'none'} | 
                            Keywords: ${item.keywords && item.keywords.length ? item.keywords.length + ' keyword(s)' : 'none'}
                            ${isComplete ? '<span class="complete-badge">✓ COMPLETE</span>' : ''}
                        </div>
                    </div>
                </div>

                <div class="tag-section">
                    <h3>Discipline (select one)</h3>
                    <div class="checkbox-group" id="disciplines-${index}">
                        ${Array.from(allDisciplines).map(d => `
                            <label class="checkbox-label">
                                <input type="radio" name="discipline-${index}" value="${d}" ${item.discipline === d ? 'checked' : ''}>
                                ${d}
                            </label>
                        `).join('')}
                    </div>
                    <div class="other-input">
                        <input type="text" id="other-discipline-${index}" placeholder="Or type a new discipline...">
                        <button onclick="addDiscipline(${index})">Add</button>
                    </div>
                </div>

                <div class="tag-section">
                    <h3>Clients (select multiple)</h3>
                    <div class="checkbox-group" id="clients-${index}">
                        ${Array.from(allClients).map(c => `
                            <label class="checkbox-label">
                                <input type="checkbox" name="client-${index}" value="${c}" ${item.clients && item.clients.includes(c) ? 'checked' : ''}>
                                ${c}
                            </label>
                        `).join('')}
                    </div>
                    <div class="other-input">
                        <input type="text" id="other-client-${index}" placeholder="Or type a new client...">
                        <button onclick="addClient(${index})">Add</button>
                    </div>
                </div>

                <div class="tag-section">
                    <h3>Keywords (comma-separated)</h3>
                    <textarea class="keywords-input" id="keywords-${index}" placeholder="e.g., fantasy, dragon, medieval">${item.keywords && item.keywords.length ? item.keywords.join(', ') : ''}</textarea>
                </div>

                <div class="tag-section">
                    <h3>Sort Order</h3>
                    <input type="number" class="sort-input" id="sort-${index}" value="${item.sort || 999}">
                </div>
            `;

            // Add change listeners
            card.querySelectorAll('input, textarea').forEach(input => {
                input.addEventListener('change', () => updateItem(index));
            });

            return card;
        }

        function addDiscipline(index) {
            const input = document.getElementById(`other-discipline-${index}`);
            const value = input.value.trim();
            if (!value) return;

            allDisciplines.add(value);
            input.value = '';
            
            // Update this card
            const container = document.getElementById(`disciplines-${index}`);
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            label.innerHTML = `
                <input type="radio" name="discipline-${index}" value="${value}" checked>
                ${value}
            `;
            label.querySelector('input').addEventListener('change', () => updateItem(index));
            container.appendChild(label);
            
            updateItem(index);
        }

        function addClient(index) {
            const input = document.getElementById(`other-client-${index}`);
            const value = input.value.trim();
            if (!value) return;

            allClients.add(value);
            input.value = '';
            
            // Update this card
            const container = document.getElementById(`clients-${index}`);
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            label.innerHTML = `
                <input type="checkbox" name="client-${index}" value="${value}" checked>
                ${value}
            `;
            label.querySelector('input').addEventListener('change', () => updateItem(index));
            container.appendChild(label);
            
            updateItem(index);
        }

        function updateItem(index) {
            const item = manifestData[index];
            
            // Update discipline
            const disciplineRadio = document.querySelector(`input[name="discipline-${index}"]:checked`);
            item.discipline = disciplineRadio ? disciplineRadio.value : '';
            
            // Update clients
            const clientCheckboxes = document.querySelectorAll(`input[name="client-${index}"]:checked`);
            item.clients = Array.from(clientCheckboxes).map(cb => cb.value);
            
            // Update keywords
            const keywordsText = document.getElementById(`keywords-${index}`).value;
            item.keywords = keywordsText
                .split(',')
                .map(k => k.trim())
                .filter(k => k.length > 0);
            
            // Update sort
            item.sort = parseInt(document.getElementById(`sort-${index}`).value) || 999;
            
            // Update card completion status
            const card = document.getElementById(`card-${index}`);
            const isComplete = item.discipline && 
                              item.clients && item.clients.length > 0 && 
                              item.keywords && item.keywords.length > 0;
            
            if (isComplete) {
                card.classList.add('complete');
            } else {
                card.classList.remove('complete');
            }
            
            updateProgress();
        }

        function updateProgress() {
            const total = manifestData.length;
            const completed = manifestData.filter(item => 
                item.discipline && 
                item.clients && item.clients.length > 0 && 
                item.keywords && item.keywords.length > 0
            ).length;
            
            const percentage = total > 0 ? (completed / total * 100).toFixed(1) : 0;
            
            document.getElementById('progress-text').textContent = `${completed} of ${total} images tagged (${percentage}%)`;
            document.getElementById('progress-fill').style.width = percentage + '%';
        }

        function saveProgress() {
            localStorage.setItem('portfolioTaggerData', JSON.stringify(manifestData));
            localStorage.setItem('portfolioTaggerDisciplines', JSON.stringify(Array.from(allDisciplines)));
            localStorage.setItem('portfolioTaggerClients', JSON.stringify(Array.from(allClients)));
            alert('Progress saved! You can close this page and come back later.');
        }

        function loadProgress() {
            const saved = localStorage.getItem('portfolioTaggerData');
            if (!saved) {
                alert('No saved progress found.');
                return;
            }
            
            manifestData = JSON.parse(saved);
            allDisciplines = new Set(JSON.parse(localStorage.getItem('portfolioTaggerDisciplines') || '[]'));
            allClients = new Set(JSON.parse(localStorage.getItem('portfolioTaggerClients') || '[]'));
            
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('filter-section').classList.remove('hidden');
            
            populateFilterDropdown();
            renderImages();
            updateProgress();
            
            alert('Progress loaded!');
        }

        function clearProgress() {
            if (!confirm('Are you sure you want to clear all saved progress? This cannot be undone.')) {
                return;
            }
            
            localStorage.removeItem('portfolioTaggerData');
            localStorage.removeItem('portfolioTaggerDisciplines');
            localStorage.removeItem('portfolioTaggerClients');
            
            alert('Progress cleared.');
        }

        function exportManifest() {
            const dataStr = JSON.stringify(manifestData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'manifest-updated.json';
            link.click();
            
            URL.revokeObjectURL(url);
            
            alert('Manifest downloaded! Send this file back to Jesse.');
        }

        // Auto-load if there's saved progress
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('portfolioTaggerData');
            if (saved) {
                const shouldLoad = confirm('Found saved progress. Would you like to continue where you left off?');
                if (shouldLoad) {
                    loadProgress();
                }
            }
        });
    </script>
</body>
</html>
